<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="ragLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="shieldFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Shield -->
  <path
    d="M24 4L38 9.5V20.5C38 30.5 32 39 24 44C16 39 10 30.5 10 20.5V9.5L24 4Z"
    fill="url(#shieldFill)"
    stroke="url(#ragLogoGrad)"
    stroke-width="2.5"
    stroke-linejoin="round"
  />

  <!-- Neural Vector Graph Nodes -->
  <circle cx="24" cy="18" r="3" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="17" cy="27" r="2.5" fill="#818cf8" />
  <circle cx="31" cy="27" r="2.5" fill="#a855f7" />
  <circle cx="24" cy="33" r="2.5" fill="#06b6d4" />

  <!-- Graph Connection Lines -->
  <line x1="24" y1="18" x2="17" y2="27" stroke="#38bdf8" stroke-width="1.8" stroke-opacity="0.8" />
  <line x1="24" y1="18" x2="31" y2="27" stroke="#a855f7" stroke-width="1.8" stroke-opacity="0.8" />
  <line x1="17" y1="27" x2="24" y2="33" stroke="#818cf8" stroke-width="1.8" stroke-opacity="0.8" />
  <line x1="31" y1="27" x2="24" y2="33" stroke="#06b6d4" stroke-width="1.8" stroke-opacity="0.8" />
  <line x1="17" y1="27" x2="31" y2="27" stroke="url(#ragLogoGrad)" stroke-width="1.2" stroke-dasharray="2 2" stroke-opacity="0.6" />

  <!-- Citation Verification Checkmark Accent -->
  <path
    d="M21 21.5L23.5 24L28 19.5"
    stroke="#ffffff"
    stroke-width="1.8"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
