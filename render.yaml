services:
  - type: web
    name: ai-rag-quality-ops-backend
    env: node
    plan: standard
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    autoDeploy: true
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: API_PREFIX
        value: api/v1
      - key: FRONTEND_URL
        value: https://ai-rag-quality-ops.vercel.app
      - key: DEFAULT_TENANT_ID
        value: tenant-default
      - key: AI_PLATFORM_URL
        sync: false
      - key: AI_PLATFORM_API_KEY
        sync: false
      - key: AI_PLATFORM_APPLICATION_ID
        value: ai-rag-quality-ops
      - key: MODEL_REGRESSION_SERVICE_URL
        sync: false
      - key: MODEL_REGRESSION_SERVICE_API_KEY
        sync: false
      - key: NOTIFICATION_SERVICE_URL
        sync: false
      - key: NOTIFICATION_SERVICE_API_KEY
        sync: false
      - key: NOTIFICATION_ALERT_RECIPIENT_EMAIL
        sync: false
